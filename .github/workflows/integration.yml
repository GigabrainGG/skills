name: Integration packages
on:
  pull_request:
    paths: ['integration/**', 'plugins/**', '.agents/plugins/**', '.claude-plugin/**', '.github/workflows/integration.yml']
  push:
    branches: [main]
    paths: ['integration/**', 'plugins/**', '.agents/plugins/**', '.claude-plugin/**', '.github/workflows/integration.yml']
permissions:
  contents: read
jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.12'
      - run: python -m pip install -r integration/requirements-dev.txt
      - run: python integration/build.py --check
      - run: python -m unittest discover -s integration/tests -v
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: '22'
      - run: npm install --global @anthropic-ai/claude-code@2.1.112
      - run: claude plugin validate plugins/gigabrain && claude plugin validate plugins/gigabrain-staging && claude plugin validate .claude-plugin/marketplace.json
